<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>阅读</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="阅读">
<meta name="theme-color" content="#f7f5f0">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app" class="app">

  <!-- ============ 书架 ============ -->
  <section class="view view-shelf" data-view="shelf">
    <header class="topbar">
      <h1 class="brand">阅读</h1>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-search" aria-label="搜索">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
        </button>
        <button class="icon-btn" id="btn-menu" aria-label="更多">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
        </button>
      </div>
    </header>
    <div class="shelf-scroll" id="shelf-scroll">
      <div class="shelf-grid" id="shelf-grid"></div>
      <p class="empty-hint" id="shelf-empty" hidden>书架还是空的<br><span>点右上角搜索，或导入书源后搜索添加</span></p>
    </div>
  </section>

  <!-- ============ 搜索 ============ -->
  <section class="view view-search" data-view="search" hidden>
    <header class="topbar">
      <button class="icon-btn" data-back aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <div class="search-field">
        <input id="search-input" type="search" placeholder="书名或作者" autocomplete="off" enterkeyhint="search">
      </div>
      <button class="text-btn" id="btn-do-search">搜索</button>
    </header>
    <div class="scroll" id="search-results"></div>
  </section>

  <!-- ============ 详情 ============ -->
  <section class="view view-info" data-view="info" hidden>
    <header class="topbar">
      <button class="icon-btn" data-back aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <h2 class="topbar-title" id="info-title">详情</h2>
    </header>
    <div class="scroll" id="info-body"></div>
  </section>

  <!-- ============ 目录 ============ -->
  <section class="view view-toc" data-view="toc" hidden>
    <header class="topbar">
      <button class="icon-btn" data-back aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <h2 class="topbar-title" id="toc-title">目录</h2>
      <button class="text-btn" id="btn-reverse">倒序</button>
    </header>
    <div class="scroll" id="toc-list"></div>
  </section>

  <!-- ============ 阅读 ============ -->
  <section class="view view-read" id="view-read" data-view="read" hidden>
    <div class="read-scroll" id="read-scroll">
      <div class="read-page" id="read-page"></div>
    </div>
    <div class="read-ui" id="read-ui">
      <div class="read-head">
        <button class="icon-btn" data-back aria-label="返回目录">
          <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <span class="read-head-title" id="read-head-title"></span>
      </div>
      <div class="read-foot">
        <button class="icon-btn" id="btn-prev" aria-label="上一章">
          <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <div class="read-progress">
          <input type="range" id="read-slider" min="0" max="100" value="0" aria-label="阅读进度">
          <span id="read-pct">0%</span>
        </div>
        <button class="icon-btn" id="btn-next" aria-label="下一章">
          <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="icon-btn" id="btn-catalog" aria-label="目录">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ============ 书源管理 ============ -->
  <section class="view view-sources" data-view="sources" hidden>
    <header class="topbar">
      <button class="icon-btn" data-back aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <h2 class="topbar-title">书源</h2>
      <button class="text-btn" id="btn-import">导入</button>
    </header>
    <div class="scroll" id="source-list"></div>
  </section>

  <!-- ============ 导入 ============ -->
  <section class="view view-import" data-view="import" hidden>
    <header class="topbar">
      <button class="icon-btn" data-back aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <h2 class="topbar-title">导入书源 / 备份</h2>
    </header>
    <div class="scroll">
      <div class="panel">
        <label class="file-drop" for="file-input">
          <strong>选择文件</strong>
          <span>支持 Legado 书源 JSON、书源备份（.json / .zip）</span>
        </label>
        <input id="file-input" type="file" accept=".json,.zip,.txt,application/json,application/zip" hidden>
        <div class="or">或粘贴 JSON / 链接</div>
        <textarea id="import-text" rows="6" placeholder="粘贴书源 JSON 内容，或输入一个 http(s) 书源订阅链接"></textarea>
        <button class="primary-btn" id="btn-import-run">导入</button>
        <pre class="import-log" id="import-log"></pre>
      </div>
    </div>
  </section>

  <div class="sheet-scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" hidden>
    <button class="sheet-item" id="sheet-sources">书源管理</button>
    <button class="sheet-item" id="sheet-import">导入书源 / 备份</button>
    <button class="sheet-item" id="sheet-about">关于</button>
    <button class="sheet-item sheet-cancel" id="sheet-cancel">取消</button>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
